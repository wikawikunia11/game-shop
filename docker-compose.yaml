services:
  postgres-db:
    image: postgres:16-alpine
    container_name: gameshop-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  product-service:
    build:
      context: ./product
      dockerfile: Dockerfile
    container_name: gameshop-product
    env_file:
      - .env
    ports:
      - "8081:8081"
    depends_on:
      - postgres-db

volumes:
  postgres-data: